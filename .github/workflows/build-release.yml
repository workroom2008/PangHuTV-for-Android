name: Build Release (iOS IPA)

# Android APK：本机 D:\Android 构建。
# iOS：默认不跑；需要发版时在 GitHub Actions 手动 workflow_dispatch，或恢复下方 tags 触发。
on:
  workflow_dispatch:
#  push:
#    tags:
#      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Assemble IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Assemble iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Collect artifacts
        id: ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          version=$(python3 -c "
          import re
          with open('pubspec.yaml') as f:
              m = re.search(r'^version:\s*([^\+\s]+)', f.read(), re.M)
              print(m.group(1) if m else 'unknown')
          ")
          short_sha="${GITHUB_SHA::7}"
          dest="PangHuTV-${version}-${short_sha}.ipa"
          (cd dist && zip -qr "$dest" Payload)
          rm -rf dist/Payload
          if [ ! -f "dist/$dest" ]; then
            echo "No IPA produced in dist/" >&2
            exit 1
          fi
          echo "Produced dist/$dest"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ecohub-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for i in {1..5}; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/*.ipa --clobber && break
            else
              notes_flag=()
              if [ -f "RELEASE.md" ] && [ -s "RELEASE.md" ]; then
                notes_flag=(--notes-file RELEASE.md)
              else
                tag_msg=$(git tag -l --format='%(contents)' "$tag" | sed '/^[[:space:]]*$/d')
                if [ -n "$tag_msg" ]; then
                  notes_flag=(--notes "$tag_msg")
                else
                  notes_flag=(--generate-notes)
                fi
              fi
              if gh release create "$tag" dist/*.ipa --title "$tag" "${notes_flag[@]}"; then
                break
              fi
              sleep 3
            fi
          done
